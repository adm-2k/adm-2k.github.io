title: "Aaron McKeever"
email: "adm2216@columbia.edu"
description: >-
  Technologist and organizer in Washington, DC, working on how new
  technologies get adopted — critically, collaboratively, and for
  public benefit.
url: "https://adm-2k.github.io"
baseurl: ""
repository: "adm-2k/adm-2k.github.io"
timezone: America/New_York

author:
  name: "Aaron McKeever"
  email: "adm2216@columbia.edu"

social:
  name: "Aaron McKeever"
  links:
    - "https://github.com/adm-2k"
    - "https://linkedin.com/in/adm2216"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

markdown: kramdown
permalink: /writing/:year/:title/

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules

defaults:
  # Blog posts
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      image: /assets/images/portrait-square.jpg
  # Pages
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/images/portrait-square.jpg
