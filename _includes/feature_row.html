<style>
    .feature-row {
        display: flex;
        justify-content: center;
        gap: 2rem;
        margin-bottom: 2rem;
    }

    .feature-item {
        background: #f6f6f8;
        border-radius: 12px;
        padding: 2rem 1rem 1rem 1rem;
        text-align: center;
        width: 260px;
        box-sizing: border-box;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .feature-image {
        width: 120px;
        height: 120px;
        object-fit: contain;
        margin-bottom: 1rem;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }

    .feature-title {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
    }

    .feature-excerpt {
        font-size: 1.1rem;
        color: #444;
        margin-bottom: 1rem;
    }

    .feature-btn {
        margin-top: 1rem;
    }
</style>
<div class="feature-row">
    {% for item in page.feature_row %}
    <div class="feature-item">
        <img src="{{ item.image_path }}" alt="{{ item.alt }}" class="feature-image" />
        <div class="feature-title">{{ item.title }}</div>
        <div class="feature-excerpt">{{ item.excerpt }}</div>
        <a href="{{ item.url }}" class="feature-btn btn btn--primary">{{ item.btn_label }}</a>
    </div>
    {% endfor %}
</div>
