<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Aaron McKeever",
    "url": "{{ site.url }}",
    "email": "mailto:{{ site.email }}",
    "jobTitle": "Programming & Events Co-Lead, The Upskilling Labs",
    "alumniOf": "Columbia University",
    "knowsLanguage": ["en", "de", "es"],
    "sameAs": [
      "https://github.com/adm-2k",
      "https://linkedin.com/in/adm2216"
    ]
  }
  </script>
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <nav class="site-nav" aria-label="Site">
      <a class="site-name" href="{{ '/' | relative_url }}" aria-label="Aaron McKeever — home">AM<span class="site-name-dot">.</span></a>
      <div class="site-links">
        <a href="{{ '/work/' | relative_url }}" {% if page.url == '/work/' %}aria-current="page"{% endif %}>Work</a>
        <a href="{{ '/writing/' | relative_url }}" {% if page.url contains '/writing/' %}aria-current="page"{% endif %}>Writing</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
        <a href="{{ '/resume/' | relative_url }}" {% if page.url == '/resume/' %}aria-current="page"{% endif %}>Résumé</a>
        <a href="https://github.com/adm-2k" class="external" rel="me">GitHub&#8599;</a>
        <button class="theme-toggle" type="button" aria-label="Switch between light and dark theme" hidden>
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 1.5 A6.5 6.5 0 0 1 8 14.5 Z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-contact">
        <span class="footer-item"><a href="mailto:adm2216@columbia.edu">adm2216@columbia.edu</a></span>
        <span class="footer-item"><span aria-hidden="true">·</span> <a href="https://github.com/adm-2k" rel="me">GitHub</a></span>
        <span class="footer-item"><span aria-hidden="true">·</span> <a href="https://linkedin.com/in/adm2216" rel="me">LinkedIn</a></span>
        <span class="footer-item"><span aria-hidden="true">·</span> <a href="{{ '/feed.xml' | relative_url }}">RSS</a></span>
      </p>
      <p class="footer-colophon">
        © {{ site.time | date: '%Y' }} Aaron McKeever · Fraunces &amp; Inter · Jekyll on GitHub Pages ·
        <a href="https://github.com/adm-2k/adm-2k.github.io">source</a>
      </p>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
